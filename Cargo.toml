[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/zacesshq/zacess"
publish = false

# the browser build downloads the core on every first visit, so it is optimised for size
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
