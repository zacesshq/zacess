name: Accessibility barrier
description: Something in Zacess got in the way of reading, listening or using it.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. We treat an accessibility barrier as a bug. You never need to share a diagnosis or anything personal: describe what happened and we will work from that. If you would rather report privately, email contact@zacess.com.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Core
        - Browser version (apps/web)
        - Apps
        - Exports
        - OCR and import
        - Read aloud
        - Reading profiles
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reading
    attributes:
      label: What you were reading or doing
      description: The kind of document or the screen you were on and what you were trying to do. Do not attach a document unless you are allowed to share it.
      placeholder: Reading a scanned lecture handout in the browser version with the Dyslexia-Friendly preset
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way
      description: What made it hard or impossible. Tell us what would have worked for you if you know.
    validations:
      required: true
  - type: input
    id: assistive-tech
    attributes:
      label: Assistive technology used (optional)
      description: Screen reader, magnifier, switch access, voice control or settings such as high contrast or larger text, with versions if you know them.
      placeholder: NVDA 2026.1 with Firefox on Windows 11
  - type: input
    id: setup
    attributes:
      label: Device and version (optional)
      placeholder: iPhone with iOS 26, app.zacess.com
