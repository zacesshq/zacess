version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # the root lockfile covers the npm workspaces, which is where apps/web gets its packages
  - package-ecosystem: npm
    directories: [/, /tools/accessibility]
    schedule:
      interval: cron
      cronjob: "0 18 1,15 * *"
      timezone: Europe/London
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
